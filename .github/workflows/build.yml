name: Build Windows installer

# push в main / ручной запуск  → сборка для проверки (Artifacts), в релизы не попадает
# push тега vX.Y.Z             → сборка + GitHub Release (по нему клиенты получают обновление)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $v в package.json"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Skhodka-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 14
